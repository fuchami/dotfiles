onboarding = false

[theme]
name = "kanagawa"

[keys]
prefix = "ctrl+q"

split_vertical = "prefix+|"

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[[keys.command]]
key = "prefix+o"
type = "pane"
command = '''
repo="$(ghq list -p | fzf --prompt='space> ')" || exit 0
[ -n "$repo" ] || exit 0
herdr_bin="${HERDR_BIN_PATH:-herdr}"
label="$(basename "$repo")"
"$herdr_bin" workspace create --cwd "$repo" --label "$label" --focus
'''
description = "open ghq space"

# for herdr-splits.nvim
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "ctrl+alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "ctrl+alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

# for herdr-quickselect
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "choplin.quickselect.open-url"
description = "Open visible URL"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "choplin.quickselect.copy"
description = "Copy visible item"

[ui]
show_agent_labels_on_pane_borders = true
window_title = "{hostname}: {workspace}"

tab_bar_right_separator = "  "
tab_bar_right = [
  { type = "command", command = "top -l 1 -n 0 | awk '/CPU usage/ {printf \" %s\", $3}'" },
  { type = "command", command = "ps -A -o %mem | awk '{s+=$1} END {printf \"󰘚 %.0f%%\", s}'" },
  { type = "datetime", format = " %H:%M" },

]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
   ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = true
