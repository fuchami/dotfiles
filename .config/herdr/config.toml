onboarding = false

[theme]
name = "kanagawa"

auto_switch = false

[terminal]
shell_mode = "login"

[keys]
prefix = "ctrl+q"
open_notification_target = 'prefix+o'

split_vertical = "prefix+|"

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

new_tab = "cmd+t"
next_tab = "cmd+shift+]"
previous_tab = "cmd+shift+["
switch_workspace = "cmd+1..9"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = '''
repo="$(ghq list -p | fzf --prompt='space> ')" || exit 0
[ -n "$repo" ] || exit 0
herdr_bin="${HERDR_BIN_PATH:-herdr}"
label="$(basename "$repo")"
"$herdr_bin" workspace create --cwd "$repo" --label "$label" --focus
'''
description = "ghqからワークスペースを開く"
width = "80%"
height = "80%"

[[keys.command]]
key = "cmd+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "90%"
height = "90%"

# for herdr-splits.nvim
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "左のPaneへ移動(NeoVim連携)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "下のPaneへ移動(NeoVim連携)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "上のPaneへ移動(NeoVim連携)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "右のPaneへ移動(NeoVim連携)"

[[keys.command]]
key = "ctrl+alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Paneを左方向にリサイズ(NeoVim連携)"

[[keys.command]]
key = "ctrl+alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Paneを下方向にリサイズ(NeoVim連携)"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Paneを上方向にリサイズ(NeoVim連携)"

[[keys.command]]
key = "ctrl+alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Paneを右方向にリサイズ(NeoVim連携)"

# for herdr-quickselect
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "choplin.quickselect.open-url"
description = "表示中のURLを開く"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "choplin.quickselect.copy"
description = "表示中の項目をコピー"

[ui]
pane_borders = "always"
show_agent_labels_on_pane_borders = true
window_title = "{hostname}: {workspace}"

tab_bar_right = [
  { type = "command", command = "top -l 1 -n 0 | awk '/CPU usage/ {printf \" %s\", $3}'" },
  { type = "command", command = "ps -A -o %mem | awk '{s+=$1} END {printf \"󰘚 %.0f%%\", s}'" },
  { type = "datetime", format = " %H:%M" },
]
tab_bar_right_separator = "  "

[ui.sidebar.agents]
row_gap = 2
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "agent"],
  ["machine"]
]

[ui.sidebar.spaces]
row_gap = 2
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = true

