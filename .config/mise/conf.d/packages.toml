# brew packages

[bootstrap.brew.taps]
"anomalyco/tap" = "https://github.com/anomalyco/homebrew-tap.git"                 # opencode-v2
"felixkratz/formulae" = "https://github.com/felixkratz/homebrew-formulae.git"     # borders
"jandedobbeleer/oh-my-posh" = "https://github.com/jandedobbeleer/homebrew-oh-my-posh.git"  # oh-my-posh
"xwmx/taps" = "https://github.com/xwmx/homebrew-taps.git"                         # nb

[bootstrap.packages]
# --- core CLI tools ---
"brew:bash" = "latest"
"brew:bat" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:jq" = "latest"
"brew:lsd" = "latest"
"brew:ripgrep" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:xdg-ninja" = "latest"

# --- shell (zsh) ---
"brew:hyfetch" = "latest"
"brew:sheldon" = "latest"
"brew:zoxide" = "latest"
"brew:jandedobbeleer/oh-my-posh/oh-my-posh" = "latest"

# --- dev runtimes ---
"brew:deno" = "latest"
"brew:go" = "latest"
"brew:node" = "latest"
"brew:uv" = "latest"
"brew:luarocks" = "latest"
"brew:pkgconf" = "latest"

# --- dev tools (VCS / editor) ---
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:go-task" = "latest"
"brew:neovim" = "latest"
"brew:lazygit" = "latest"

# --- TUI / personal tools ---
"brew:herdr" = "latest"
"brew:mactop" = "latest"
"brew:xwmx/taps/nb" = "latest"
"brew:ollama" = "latest"
"brew:anomalyco/tap/opencode-v2" = "latest"
"brew:yazi" = "latest"

# --- image / document / network ---
"brew:imagemagick" = "latest"
"brew:poppler" = "latest"
"brew:mosh" = "latest"

# --- macOS: window management / look & feel ---
"brew-cask:nikitabobko/tap/aerospace" = { version = "latest", adopt = true }
"brew:felixkratz/formulae/borders" = "latest"
"brew-cask:font-hackgen" = { version = "latest", adopt = true }
"brew-cask:font-hackgen-nerd" = { version = "latest", adopt = true }

# --- macOS: terminals / dev apps ---
"brew-cask:ghostty" = { version = "latest", adopt = true }
"brew-cask:wezterm" = { version = "latest", adopt = true }
"brew-cask:visual-studio-code" = { version = "latest", adopt = true }
"brew-cask:codex" = { version = "latest", adopt = true }
"brew-cask:terminal-browser" = { version = "latest", adopt = true }

# --- macOS: input / keyboard ---
"brew-cask:google-japanese-ime" = { version = "latest", adopt = true }
"brew-cask:karabiner-elements" = { version = "latest", adopt = true }

# --- macOS: other apps ---
"brew-cask:raycast" = { version = "latest", adopt = true }
"brew-cask:readdle-spark" = { version = "latest", adopt = true }
"brew-cask:slack" = { version = "latest", adopt = true }
"brew-cask:spotify" = { version = "latest", adopt = true }
