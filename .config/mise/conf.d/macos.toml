# macOS system settings
# 現機の設定を正として宣言（新 Mac で同じ環境を再現する）

[bootstrap.macos.dock]
tilesize = 40
largesize = 100
magnification = true
autohide = true
show_recents = false

[bootstrap.macos.defaults."com.apple.dock"]
mineffect = "genie"
# ウィンドウをアプリケーションアイコンに縮小
"minimize-to-application" = true
# ホットコーナー: 右上=通知センター、他=なし
"wvous-tl-corner" = 1
"wvous-tl-modifier" = 0
"wvous-tr-corner" = 12
"wvous-tr-modifier" = 0
"wvous-bl-corner" = 1
"wvous-bl-modifier" = 0
"wvous-br-corner" = 1
"wvous-br-modifier" = 0

[bootstrap.macos.finder]
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.defaults."com.apple.finder"]
# プレビューペインを表示
ShowPreviewPane = true
# デスクトップに HDD / 外付け / 取り出しメディアを表示しない
ShowHardDrivesOnDesktop = false
ShowExternalHardDrivesOnDesktop = false
ShowRemovableMediaOnDesktop = false
# ごみ箱の項目を 30 日後に自動削除
FXRemoveOldTrashItems = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
# ダークモード
AppleInterfaceStyle = "Dark"
# ウィンドウタブを常に使う
AppleWindowTabbingMode = "always"
# サイドバーのアイコンサイズ: 小
NSTableViewDefaultSizeMode = 1
# ダブルクリック認識時間（秒）・ポインタ速度・スクロール速度・キーリピート
# ※ mouse/trackpad/scrollwheel/KeyRepeat は real 型のため float で書く（便利キーの key_repeat は integer で書かれるため不使用）
"com.apple.mouse.doubleClickThreshold" = 0.15
"com.apple.mouse.scaling" = 3.0
"com.apple.scrollwheel.scaling" = 1.7
"com.apple.trackpad.scaling" = 3.0
"KeyRepeat" = 2.0
"InitialKeyRepeat" = 15.0
# フォースクリックを無効化
"com.apple.trackpad.forceClick" = false

[bootstrap.macos.trackpad]
three_finger_drag = true
tap_to_click = true

[bootstrap.macos.defaults."com.apple.screencapture"]
# スクリーンショットはウィンドウキャプチャモード・クリップボードにコピー
target = "clipboard"
style = "window"

# Spotlight のショートカット（Cmd+Space / Cmd+Option+Space）を無効化
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"]
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65", "enabled"]
value = false

[bootstrap.hooks.post-defaults]
run = "killall Dock || true"
run_only_on = ["macos"]
