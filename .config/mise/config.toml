# mise グローバル設定のエントリポイント
# 内容は conf.d/ に分割:
#   conf.d/packages.toml - brew パッケージ ([bootstrap.packages] / [bootstrap.brew.taps])
#   conf.d/macos.toml    - macOS defaults ([bootstrap.macos.*] / hooks)

[tools]
# --- runtimes ---
ruby = "3"
deno = "2"
node = "26"
go = "1"
uv = "latest"
# --- core CLI ---
bat = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
lsd = "latest"
ripgrep = "latest"
# --- shell ---
sheldon = "latest"
zoxide = "latest"
oh-my-posh = "latest"
# --- dev tools ---
delta = "latest"
gh = "latest"
ghq = "latest"
task = "latest"
lazygit = "latest"
neovim = "latest"
# --- TUI ---
yazi = "latest"
herdr = "latest"
