# $schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
console_title_template: "{{ .Shell }} in {{ .Folder }}"
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        style: diamond
        foreground: "#ffffff"
        background: "#222222"
        template: " {{.Icon}} <#7a7a7a></>"
      - type: path
        style: powerline
        powerline_symbol: 
        foreground: "#00afff"
        background: "#222222"
        template: "  {{ .Path }} "
        properties:
          home_icon: "~"
          style: full
      - style: powerline
        type: git
        powerline_symbol: 
        foreground: "#000000"
        background: "#00dd00"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#c4a000{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f26d50{{ end }}"
          - "{{ if gt .Ahead 0 }}#89d1dc{{ end }}"
          - "{{ if gt .Behind 0 }}#4e9a06{{ end }}"
        template: " {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
        properties:
          branch_icon: " "
          fetch_status: true
          fetch_upstream_icon: true
  - type: prompt
    alignment: right
    segments:
      - style: powerline
        type: python
        powerline_symbol: 
        invert_powerline: true
        foreground: "#ffffff"
        background: "#3776AB"
        template: "  {{ if .Venv }}({{ .Venv }}) {{ end }}{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        properties:
          display_mode: files
          fetch_virtual_env: true
      - style: powerline
        type: aws
        powerline_symbol: 
        invert_powerline: true
        foreground: "#ffffff"
        background_templates:
          - '{{if contains "default" .Profile}}#FFA400{{end}}'
          - '{{if contains "jan" .Profile}}#f1184c{{end}}'
        template: " {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }}  "
        properties:
          display_default: false
      - style: powerline
        type: root
        powerline_symbol: 
        invert_powerline: true
        foreground: "#111111"
        background: "#ffff66"
        template: "  "
      - style: powerline
        type: executiontime
        powerline_symbol: 
        invert_powerline: true
        foreground: "#9b9b9b"
        background: "#222222"
        template: " {{ .FormattedMs }}  "
      - style: powerline
        type: status
        powerline_symbol: 
        invert_powerline: true
        foreground: "#d3d7cf"
        background: "#222222"
        background_templates:
          - "{{ if gt .Code 0 }}#cc2222{{ end }}"
        template: " {{ if gt .Code 0 }}{{ reason .Code }}{{ else }}<#00dd00></>{{ end }} "
        properties:
          always_enabled: true
  - type: prompt
    alignment: left
    segments:
      - style: plain
        type: status
        foreground: "#42e66c"
        foreground_templates:
          - "{{ if gt .Code 0 }}#FF5252{{ end }}"
        template: "❯"
        properties:
          always_enabled: true
    newline: true

transient_prompt:
  background: transparent
  foreground: "#42e66c"
  template: "❯ "

tooltips_action: replace
tooltips:
  - type: kubectl
    tips:
      - kubectl
      - kubectx
      - k
      - ktx
    style: powerline
    powerline_symbol: 
    foreground: "#000000"
    background: "#4da6ff"
    template: "  {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}} "
final_space: true
version: 3
