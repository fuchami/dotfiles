# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

upgrade:
  source: cdn
  interval: 168h
  auto: false
  notice: false
console_title_template: "{{ .Shell }} in {{ .Folder }}"
blocks:
  - type: prompt
    alignment: left
    segments:
      - leading_diamond: ╭─
        template: " {{ if .WSL }}WSL at {{ end }}{{.Icon}} "
        foreground: "#000000"
        background: "#d3d7cf"
        type: os
        style: diamond
      - properties:
          home_icon: "~"
          style: full
        template: "  {{ .Path }} "
        foreground: "#e4e4e4"
        powerline_symbol: 
        background: "#3465a4"
        type: path
        style: powerline
      - properties:
          branch_icon: " "
          fetch_status: true
          fetch_upstream_icon: true
        template: " {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
        foreground: "#000000"
        powerline_symbol: 
        background: "#4e9a06"
        type: git
        style: powerline
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#c4a000{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f26d50{{ end }}"
          - "{{ if gt .Ahead 0 }}#89d1dc{{ end }}"
          - "{{ if gt .Behind 0 }}#4e9a06{{ end }}"
  - type: prompt
    alignment: right
    segments:
      - properties:
          fetch_version: true
        template: " {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}  "
        foreground: "#ffffff"
        powerline_symbol: 
        background: "#689f63"
        type: node
        style: powerline
        invert_powerline: true
      - properties:
          fetch_version: true
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  "
        foreground: "#111111"
        powerline_symbol: 
        background: "#00acd7"
        type: go
        style: powerline
        invert_powerline: true
      - properties:
          display_mode: files
          fetch_virtual_env: false
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  "
        foreground: "#111111"
        powerline_symbol: 
        background: "#FFDE57"
        type: python
        style: powerline
        invert_powerline: true
      - properties:
          display_default: false
        template: " {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }}  "
        foreground: "#ffffff"
        powerline_symbol: 
        type: aws
        style: powerline
        background_templates:
          - '{{if contains "default" .Profile}}#FFA400{{end}}'
          - '{{if contains "jan" .Profile}}#f1184c{{end}}'
        invert_powerline: true
      - template: "  "
        foreground: "#111111"
        powerline_symbol: 
        background: "#ffff66"
        type: root
        style: powerline
        invert_powerline: true
      - template: " {{ .FormattedMs }}  "
        foreground: "#000000"
        powerline_symbol: 
        background: "#c4a000"
        type: executiontime
        style: powerline
        invert_powerline: true
      - properties:
          always_enabled: true
        template: " {{ if gt .Code 0 }}{{ reason .Code }}{{ else }}{{ end }} "
        foreground: "#d3d7cf"
        powerline_symbol: 
        background: "#000000"
        type: status
        style: powerline
        background_templates:
          - "{{ if gt .Code 0 }}#cc2222{{ end }}"
        invert_powerline: true
      - trailing_diamond: ─╮
        template: " {{ .CurrentDate | date .Format }}  "
        foreground: "#000000"
        background: "#d3d7cf"
        type: time
        style: diamond
        invert_powerline: true
  - type: prompt
    alignment: left
    segments:
      - template: ╰─
        foreground: "#d3d7cf"
        type: text
        style: plain
    newline: true
  - type: rprompt
    segments:
      - template: ─╯
        foreground: "#d3d7cf"
        type: text
        style: plain
tooltips_action: replace
tooltips:
  - type: kubectl
    tips:
      - kubectl
      - kubectx
      - k
      - ktx
    style: powerline
    powerline_symbol: 
    foreground: "#000000"
    background: "#ebcc34"
    template: " ﴱ {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}} "
version: 3
final_space: true
